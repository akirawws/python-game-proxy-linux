{% extends "base.html" %}
{% block title %}События{% endblock %}
{% block header %}Журнал событий{% endblock %}

{% block content %}
<div class="mb-6 flex justify-between items-center">
    <p class="text-slate-400">История обнаруженных аномалий и действий системы.</p>
    <div class="flex gap-2">
        <select class="bg-slate-800 border border-slate-700 text-sm rounded px-3 py-2 text-white">
            <option>Все уровни</option>
            <option>Высокий</option>
            <option>Средний</option>
            <option>Низкий</option>
        </select>
    </div>
</div>

<div class="bg-slate-900 rounded-lg border border-slate-800 overflow-hidden">
    <table class="w-full text-left border-collapse">
        <thead>
            <tr class="bg-slate-800/50 border-b border-slate-800 text-slate-300">
                <th class="p-4 font-medium">Время</th>
                <th class="p-4 font-medium">Сервер</th>
                <th class="p-4 font-medium">Событие</th>
                <th class="p-4 font-medium">Риск</th>
                <th class="p-4 font-medium">Результат</th>
            </tr>
        </thead>
        <tbody id="events-table-body">
            <tr><td colspan="5" class="p-4 text-center text-slate-500">Загрузка...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // Функция для форматирования времени
    function formatTime(isoString) {
        const date = new Date(isoString);
        return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    // Функция для красивого бейджа уровня риска
    function getSeverityBadge(severity) {
        if (severity === 'Высокий') return '<span class="px-2.5 py-1 rounded text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20">Высокий</span>';
        if (severity === 'Средний') return '<span class="px-2.5 py-1 rounded text-xs font-medium bg-yellow-500/10 text-yellow-400 border border-yellow-500/20">Средний</span>';
        return '<span class="px-2.5 py-1 rounded text-xs font-medium bg-green-500/10 text-green-400 border border-green-500/20">Низкий</span>';
    }

    async function loadEvents() {
        const res = await fetch('/api/events/');
        const data = await res.json();
        const tbody = document.getElementById('events-table-body');
        
        if (data.events.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-500">Событий пока нет</td></tr>';
            return;
        }

        tbody.innerHTML = data.events.map(e => `
            <tr class="border-b border-slate-800 hover:bg-slate-800/30 transition-colors">
                <td class="p-4 text-slate-400 font-mono text-sm">${formatTime(e.timestamp)}</td>
                <td class="p-4 font-medium text-white">${e.server}</td>
                <td class="p-4">
                    <div class="text-slate-200">${e.type}</div>
                    <div class="text-xs text-slate-500 mt-1">${e.details}</div>
                </td>
                <td class="p-4">${getSeverityBadge(e.severity)}</td>
                <td class="p-4 text-slate-400 text-sm">${e.status}</td>
            </tr>
        `).join('');
    }

    // Загружаем при старте
    loadEvents();
</script>
{% endblock %}
