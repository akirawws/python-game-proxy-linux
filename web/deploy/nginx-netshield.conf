# =============================================================================
# NetShield — пример конфигурации nginx для публикации панели оператора.
#
# Схема: интернет/VPN -> nginx (TLS, :80/:443) -> uvicorn 127.0.0.1:8000
#
# Порядок применения:
#   1. Соберите фронтенд:  cd web/frontend && npm install && npm run build
#   2. Положите сертификат и ключ (например, Let's Encrypt):
#        /etc/letsencrypt/live/netshield.example.com/fullchain.pem
#        /etc/letsencrypt/live/netshield.example.com/privkey.pem
#   3. Скопируйте файл в /etc/nginx/sites-available/netshield.conf,
#      поправьте server_name и пути, включите симлинком в sites-enabled.
#   4. nginx -t && systemctl reload nginx
#
# ВАЖНО: в .env приложения должно быть
#   NETSHIELD_HOST=127.0.0.1
#   COOKIE_SECURE=true
#   TRUST_PROXY_HEADERS=true
# иначе cookie сессии не будет отправляться по HTTPS, а в аудите будет
# записан IP nginx вместо IP оператора.
# =============================================================================

# Ограничение частоты запросов к API входа (защита от перебора).
limit_req_zone $binary_remote_addr zone=netshield_login:10m rate=10r/m;

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name netshield.example.com;

    # ACME-ответы Let's Encrypt оставляем по HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name netshield.example.com;

    ssl_certificate     /etc/letsencrypt/live/netshield.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netshield.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Заголовки безопасности дублируются приложением, здесь — для статики.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Панель не предназначена для больших загрузок.
    client_max_body_size 1m;

    # --- Статика React-сборки: кэшируем хэшированные ассеты ---------------
    location /static/dist/assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html и прочие файлы сборки кэшировать нельзя.
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }

    # --- Вход: ограничение частоты ---------------------------------------
    location = /api/auth/login {
        limit_req zone=netshield_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/netshield-proxy-headers.conf;
    }

    # --- REST API ---------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/netshield-proxy-headers.conf;

        # Скачивание метрик/аудита может быть медленнее обычного запроса.
        proxy_read_timeout 60s;
    }

    # --- SPA: все остальные пути отдаёт FastAPI (index.html) --------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/netshield-proxy-headers.conf;
    }
}

# =============================================================================
# /etc/nginx/snippets/netshield-proxy-headers.conf
# -----------------------------------------------------------------------------
# Создайте этот файл отдельно (или продублируйте блок в каждой location):
#
#   proxy_http_version 1.1;
#   proxy_set_header Host              $host;
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_set_header Upgrade           $http_upgrade;
#   proxy_set_header Connection        "";
#   proxy_buffering off;
# =============================================================================
